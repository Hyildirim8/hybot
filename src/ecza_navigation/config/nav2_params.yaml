# nav2_params.yaml — Nav2 tuning for ecza-robotu 4-wheel mecanum rover.
#
# Robot footprint: ~0.38 m × 0.26 m
# Max speed: 1.5 m/s linear, 3.0 rad/s angular
# Sensor: RPLidar A2M12 — 360°, 12 m range, ~10 Hz
#
# Planner:  NavFn (global) — reliable A* global planner
# Controller: DWB (local)  — dynamic window approach, good on flat ground
#             RPP (alternative, uncomment below) — Regulated Pure Pursuit,
#             smoother paths, better for narrow corridors
#
# To switch to RPP:  comment DWB block, uncomment RPP block below.
# ---------------------------------------------------------------------------

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.15
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    # Mecanum base is holonomic; using the omni motion model avoids AMCL
    # over-trusting differential-drive assumptions during strafing / rotation.
    # (odom_model_type is a pre-Humble AMCL param and no longer exists —
    # verified against nav2_amcl/src/amcl_node.cpp on the humble branch;
    # robot_model_type below is the real Humble-era plugin selector.)
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"  # mecanum is holonomic/omnidirectional
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan
    map_topic: /map
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 100
    default_server_timeout: 10000
    wait_for_service_timeout: 1000
    # error_code_names is an Iron/Jazzy+ bt_navigator param — not declared by
    # nav2_bt_navigator on Humble (verified against source), so it was dropped.
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    # Costmap-temizlemeli recovery ağacı: tek planlama/takip hatasında hedefi
    # düşürmek yerine costmap'leri temizleyip yeniden dener (fiziksel spin yok —
    # keşifte slam_manager kara listesi bozulmaz, RViz hedefleri çok daha dayanıklı).
    default_nav_to_pose_bt_xml: "/ws/install/share/ecza_navigation/config/navigate_to_pose_w_recovery.xml"
    # bt_navigator always instantiates navigate_through_poses. Point it to the
    # no-recovery tree so it does not need Spin / BackUp plugins.
    default_nav_through_poses_bt_xml: "/ws/install/share/ecza_navigation/config/navigate_through_poses_no_recovery.xml"
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    # Plugins for navigate_to_pose_w_recovery.xml + navigate_through_poses_no_recovery.xml.
    # ReactiveSequence is a BehaviorTree.CPP built-in — no separate plugin needed.
    plugin_lib_names:
      - nav2_pipeline_sequence_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      # Costmap temizleme recovery'si için eklendi (bkz. iki BT xml dosyası).
      # Fiziksel hareket YOK — Spin/BackUp node'ları bilerek kayıtlı değil.
      - nav2_recovery_node_bt_node
      - nav2_clear_costmap_service_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 6.0   # MPPI: 1000 samples×40 steps on Pi 5 is stable at 6 Hz
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001     # non-zero: mecanum can strafe
    min_theta_velocity_threshold: 0.001
    # 5.0 -> 1.0. Bu, controller geçerli bir komut üretemediğinde robotun SON
    # komutla ne kadar süre sürmeye devam edeceği. 5 saniye, 0.75 m/s'de ~3.7
    # metre KÖR sürüş demek — otonom modda doğrudan çarpma sebebi. Costmap ve
    # DWB transform_tolerance değerleri de 1.0'a çekildi, dolayısıyla TF
    # gecikmesine karşı tampon hâlâ var. MentorPi 0.3 kullanıyor.
    failure_tolerance: 1.0
    # Humble'da parametrenin adı TEKİL: progress_checker_plugin.
    # Çoğul biçim (progress_checker_plugins) Iron ile geldi; burada
    # tanımlanmadığı için sessizce yok sayılıyordu. Canlı doğrulama:
    # `ros2 param list /controller_server | grep progress` -> yalnızca
    # `progress_checker_plugin` çıkıyor. Varsayılan id de "progress_checker"
    # olduğu için aşağıdaki alt-blok şans eseri uygulanıyordu; yine de
    # yapılandırmanın gerçekten okunduğu bir isim kullanılıyor.
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    odom_topic: "odom"
    # use_realtime_priority is not declared by nav2_controller on Humble
    # (added in a later distro) — verified against source, dropped.

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 8.0   # 8 s'de 10 cm ilerleyemediyse takılmıştır — beklemeyi uzatma

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15   # 0.08 mecanum kayması ile hedef etrafında yörüngeye sokuyordu
      # Frontier exploration only needs the robot to reach the area; forcing a
      # final heading makes the rover spin in place around otherwise valid goals.
      yaw_goal_tolerance: 3.14

    # ── MPPI Local Planner (Model Predictive Path Integral) ───────────────
    # State-of-the-art Nav2 controller. Samples trajectory rollouts each
    # cycle, weights by cost, blends into a smooth command — no stop-and-replan.
    # motion_model: "Omni" enables vy sampling for mecanum holonomic motion.
    # batch_size/time_steps reduced from 1000/24 — RPi5 is CPU-oversubscribed
    # with the full stack (SLAM + EKF + IMU + camera + nav all concurrent);
    # 600x18 (~55% fewer rollouts) frees real headroom with minimal quality
    # loss at this robot's speed/size.
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: -0.8
      min_vel_y: -0.65
      max_vel_x:  0.75
      max_vel_y:  0.45
      max_vel_theta: 0.45
      min_speed_xy: 0.0
      max_speed_xy: 0.90
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.9
      acc_lim_theta: 0.40
      decel_lim_x: -1.2
      decel_lim_y: -1.0
      decel_lim_theta: -0.45
      vx_samples: 8
      vy_samples: 6
      vtheta_samples: 6
      sim_time: 1.2
      linear_granularity: 0.05
      angular_granularity: 0.025
      # 4.0 -> 1.0. DWB yörüngeleri odom karesinde değerlendirirken 4 saniyelik
      # bayat TF kullanmak, robotun 3 metre önce bulunduğu yer için plan yapması
      # demekti. failure_tolerance ile birlikte düşürüldü.
      transform_tolerance: 1.0
      xy_goal_tolerance: 0.08
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["Oscillation", "BaseObstacle", "ObstacleFootprint",
                "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 4.0
      ObstacleFootprint.scale: 6.0   # düşürüldü: dar geçişlerde tüm yörüngeleri reddetmiyordu
      PathAlign.scale: 20.0
      PathAlign.forward_point_distance: 0.2
      GoalAlign.scale: 14.0
      GoalAlign.forward_point_distance: 0.2
      PathDist.scale: 32.0           # artırıldı: dar geçişlerde planlanan yola sıkı uy
      GoalDist.scale: 18.0

    # ── RPP Alternative (uncomment to use Regulated Pure Pursuit) ──────────
    # FollowPath:
    #   plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
    #   desired_linear_vel: 0.5
    #   lookahead_dist: 0.6
    #   min_lookahead_dist: 0.3
    #   max_lookahead_dist: 0.9
    #   lookahead_time: 1.5
    #   rotate_to_heading_angular_vel: 1.8
    #   transform_tolerance: 0.5
    #   use_velocity_scaled_lookahead_dist: false
    #   min_approach_linear_velocity: 0.05
    #   approach_velocity_scaling_dist: 0.6
    #   use_collision_detection: true
    #   max_allowed_time_to_collision_up_to_carrot: 1.0
    #   use_regulated_linear_velocity_scaling: true
    #   use_cost_regulated_linear_velocity_scaling: false
    #   regulated_linear_scaling_min_radius: 0.9
    #   regulated_linear_scaling_min_speed: 0.25
    #   allow_reversing: false
    #   use_rotate_to_heading: true
    #   rotate_to_heading_min_angle: 0.785
    #   max_angular_accel: 3.2
    #   max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      # 12x12 -> 6x6 sayesinde hücre sayısı 57.6k'dan 14.4k'ya düştü, o yüzden
      # güncelleme hızı 2.5 -> 4.0'a çıkarılabildi. Local costmap'in görevi
      # rviz'de manzara göstermek değil, DWB'nin denediği yörüngeleri
      # kapsamaktır: sim_time 1.2 s x max_speed_xy 0.90 m/s = 1.1 m ileri.
      # 6x6 (robot etrafında 3 m yarıçap) buna fazlasıyla yeter; 12 m menzilin
      # tamamı zaten global costmap'te (yukarıda obstacle_layer eklendi) ve
      # /scan görselleştirmesinde görünüyor.
      update_frequency: 4.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      # 3.0 -> 1.0. 3 saniyelik tolerans, 0.75 m/s'de 2.2 metrelik konum
      # hatasıyla engel işaretlemek demek — engeller costmap'e yanlış yere
      # çizilir. 1.0 s RPi gecikmesi için hâlâ cömert (MentorPi 0.1 kullanıyor).
      transform_tolerance: 1.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Square footprint matching rover body (0.38 m × 0.26 m) + 1 cm padding
      footprint: "[[0.21, 0.15], [0.21, -0.15], [-0.21, -0.15], [-0.21, 0.15]]"
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # global_costmap'teki aynı gerekçe: inflation_radius circumscribed
        # yarıçaptan (0.258 m) büyük olmalı. Local'de 0.30 yeterli — DWB'nin
        # ObstacleFootprint kritiği gerçek footprint ile çarpışmayı zaten
        # kesin olarak kontrol ediyor, burada amaç sadece tutarlı maliyet.
        cost_scaling_factor: 3.0
        inflation_radius: 0.30
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # tf_filter_tolerance is not a real nav2_costmap_2d::ObstacleLayer param
        # on Humble (verified against source) — the laser message_filter's TF
        # wait tolerance is hardcoded to 0.05s in obstacle_layer.cpp on this
        # distro, not configurable. The costmap-level transform_tolerance: 3.0
        # above is the real RPi-lag safety margin.
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          # 4.0 -> 12.0: temizleme menzili işaretleme menzilinden büyük
          # olmalı, aksi halde uzaktaki eski engeller hiç silinmez.
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          # 3.0 -> 10.0: asıl kesme buydu. Lidar 12 m'ye kadar dönüş veriyor
          # ama 3 m'den uzaktaki algılamalar engel olarak işaretlenmediği için
          # rviz'de daire olarak çizilmiyordu. Geçerli dönüşlerin %99'u 10 m
          # içinde, dolayısıyla 10 m pratikte tüm algılamaları kapsıyor.
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
          inf_is_valid: false
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 1.0   # local_costmap ile aynı gerekçe (3.0 -> 1.0)
      # Rolling window KAPALI: static_layer, costmap'i gelen /map ile birebir
      # aynı boyuta ve orijine getirir (resizeMap). Böylece rviz'de costmap ile
      # harita tam üst üste biner (tek bölge) ve keşif ilerledikçe costmap de
      # haritayla birlikte büyür — sabit pencerede kalan kırpma sorunu olmaz.
      #
      # ÖNKOŞUL: /map geçerli olmalı. Bu ayar bir kez denenip geri alınmıştı;
      # o sırada scan_restamper'ın slam_angle_downsample=4 ayarı yüzünden
      # slam_toolbox'a giden taramalar boş geliyor ve /map KALICI olarak 0x0
      # kalıyordu. static_layer bunu "malformed" diye reddedince costmap
      # varsayılan orijinde ([0,12]x[0,12]) asılı kalıyor, harita ile robot
      # rviz'de iki ayrı bölge gibi görünüyordu. slam_angle_downsample=2
      # düzeltmesinden sonra harita saniyeler içinde oluştuğu için bu mod
      # artık güvenli; hizasızlık yalnızca ilk /map gelene kadar sürer.
      rolling_window: false
      # Sadece ilk /map mesajı gelene kadar kullanılan başlangıç boyutu;
      # sonrasında boyutu static_layer belirler.
      width: 20
      height: 20
      footprint: "[[0.21, 0.15], [0.21, -0.15], [-0.21, -0.15], [-0.21, 0.15]]"
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: true
      # obstacle_layer EKLENDİ (2026-08-12). Önceden sadece static + inflation
      # vardı, yani global planner YALNIZCA /map'i görüyordu. /map ise SLAM'da
      # 1.5 s'de bir (map_update_interval), nav modunda ise HİÇ güncellenmiyor.
      # Sonuç: haritada olmayan bir engel (insan, sandalye, açılmış kapı)
      # planner için görünmezdi — planner tam üstünden geçen bir yol üretiyor,
      # local planner engeli görüp yolu reddediyor, robot duruyor ve hedef
      # başarısız oluyordu. MentorPi de global costmap'te obstacle_layer
      # kullanıyor (navigation/config/nav2_params.yaml).
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          # clearing menzili marking menzilinden büyük olmalı, yoksa uzaklaşan
          # engeller global costmap'te kalıcı hayalet olarak kalır.
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 0.22 -> 0.35, cost_scaling_factor 2.0 -> 3.0.
        #
        # Footprint 0.42 x 0.30 m: inscribed yarıçap 0.15, circumscribed 0.258.
        # inflation_radius (0.22) circumscribed'ın (0.258) ALTINDAYDI — bu
        # geçersiz bir yapılandırma: costmap'in daire yaklaşımı ile DWB'nin
        # gerçek footprint çarpışma testi birbiriyle çelişiyor, planner köşeleri
        # kesen yollar üretiyor ve controller sonra bunları reddediyordu.
        #
        # NOT: inflation_radius geçişleri DARALTMAZ. Sadece inscribed yarıçap
        # (0.15 m) içindeki hücreler 254/LETHAL olur; onun dışındaki şişirme
        # navfn için "pahalı ama geçilebilir"dir (navfn yalnızca 254'ü engel
        # sayar). 0.35, dar kapıları kapatmadan yolu koridor ortasına çeker.
        # Daha önce 0.35 -> 0.22 indirilmesinin gerekçesi ("min geçiş genişliği
        # 0.96m") bu yüzden geçerli değildi.
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""   # set at launch time via map:= argument

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 4.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true        # A* is more efficient than Dijkstra on open maps
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    # On Humble, nav2_behaviors::BehaviorServer only declares a single
    # "costmap_topic"/"footprint_topic" pair (no local_/global_ split — that's
    # a later-distro addition) and a single "global_frame" (default "odom",
    # not "map") consumed by TimedBehavior for the local-costmap-relative
    # behaviors (Spin/BackUp/DriveOnHeading). "local_frame" was never a real
    # param. Verified against nav2_behaviors/src/behavior_server.cpp on the
    # humble branch. Values below point at local_costmap either way, so this
    # is a naming fix, not a behavior change — no impact on "wait" (see below).
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 12.0
    # BackUp: short physical reverse to escape wall contact when MPPI optimizer
    # fails (all sampled trajectories in lethal zone). Spin is still disabled —
    # it wastes time during frontier exploration.
    behavior_plugins: ["backup", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    # nav2_behaviors::Wait is a pure timer (no TF/costmap use — verified
    # against wait.cpp), so global_frame/robot_base_frame/transform_tolerance
    # below are inert for it; kept correct in case Spin/BackUp/DriveOnHeading
    # (which DO read simulate_ahead_time/*_rotational_vel/rotational_acc_lim)
    # are ever re-enabled.
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 1.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.2

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    # action_server_result_timeout is not declared by nav2_waypoint_follower
    # on Humble (verified against source) — dropped.
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 10.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Açısal limit DWB max_vel_theta'nın (0.65) üzerinde olmalı — 0.55 dönüş
    # komutlarını kırpıyordu. Açısal ivme 0.50 → 0.80: kaçış dönüşü hedef
    # hıza recovery fazı bitmeden ulaşsın.
    max_velocity: [1.0, 0.55, 0.70]  # match vx_max
    min_velocity: [-0.75, -0.50, -0.70]
    max_accel: [1.2, 1.0, 0.80]
    max_decel: [-1.5, -1.2, -0.80]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# Lifecycle manager — increase bond_timeout for slower hardware (Raspberry Pi).
# Default 4.0 s is too tight; behavior_server takes ~6 s to bond on first start.
lifecycle_manager_navigation:
  ros__parameters:
    bond_timeout: 10.0
    attempt_respawn_reconnection: false
