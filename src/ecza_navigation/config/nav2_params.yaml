# nav2_params.yaml — Nav2 tuning for ecza-robotu 4-wheel mecanum rover.
#
# Robot footprint: ~0.38 m × 0.26 m
# Max speed: 1.5 m/s linear, 3.0 rad/s angular
# Sensor: RPLidar A2M12 — 360°, 12 m range, ~10 Hz
#
# Planner:  NavFn (global) — reliable A* global planner
# Controller: DWB (local)  — dynamic window approach, good on flat ground
#             RPP (alternative, uncomment below) — Regulated Pure Pursuit,
#             smoother paths, better for narrow corridors
#
# To switch to RPP:  comment DWB block, uncomment RPP block below.
# ---------------------------------------------------------------------------

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_slow: 0.001
    lambda_fast: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.15
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    # Mecanum base is holonomic; using the omni motion model avoids AMCL
    # over-trusting differential-drive assumptions during strafing / rotation.
    odom_model_type: "omni"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"  # mecanum is holonomic/omnidirectional
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan
    map_topic: /map
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 100
    default_server_timeout: 10000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    # Costmap-temizlemeli recovery ağacı: tek planlama/takip hatasında hedefi
    # düşürmek yerine costmap'leri temizleyip yeniden dener (fiziksel spin yok —
    # keşifte slam_manager kara listesi bozulmaz, RViz hedefleri çok daha dayanıklı).
    default_nav_to_pose_bt_xml: "/ws/install/share/ecza_navigation/config/navigate_to_pose_w_recovery.xml"
    # bt_navigator always instantiates navigate_through_poses. Point it to the
    # no-recovery tree so it does not need Spin / BackUp plugins.
    default_nav_through_poses_bt_xml: "/ws/install/share/ecza_navigation/config/navigate_through_poses_no_recovery.xml"
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    # Plugins for navigate_to_pose_w_recovery.xml + navigate_through_poses_no_recovery.xml.
    # ReactiveSequence is a BehaviorTree.CPP built-in — no separate plugin needed.
    plugin_lib_names:
      - nav2_pipeline_sequence_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_back_up_action_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 6.0   # MPPI: 1000 samples×40 steps on Pi 5 is stable at 6 Hz
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001     # non-zero: mecanum can strafe
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 4.0    # MPPI rarely hard-fails; give it time before slam_manager fallback
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    odom_topic: "odom"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 8.0   # 8 s'de 10 cm ilerleyemediyse takılmıştır — beklemeyi uzatma

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15   # 0.08 mecanum kayması ile hedef etrafında yörüngeye sokuyordu
      # Frontier exploration only needs the robot to reach the area; forcing a
      # final heading makes the rover spin in place around otherwise valid goals.
      yaw_goal_tolerance: 3.14

    # ── MPPI Local Planner (Model Predictive Path Integral) ───────────────
    # State-of-the-art Nav2 controller. Samples 1000 trajectory rollouts each
    # cycle, weights by cost, blends into a smooth command — no stop-and-replan.
    # motion_model: "Omni" enables vy sampling for mecanum holonomic motion.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 28
      model_dt: 0.17          # must be >= 1/controller_frequency (1/6 ≈ 0.167)
      batch_size: 1500
      vx_std: 0.45             # wider sampling → more high-speed / escape trajectories explored
      vy_std: 0.35             # wider lateral sampling → better tight-corridor threading
      wz_std: 0.4
      vx_max:  1.0             # was 0.75 — rover does 1.5 m/s; 1.0 is safe for Nav2
      vx_min: -0.30
      vy_max:  0.50
      vy_min: -0.50
      wz_max:  0.65
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 4.0
      temperature: 0.5         # was 0.3 — more exploration diversity, less warm-start bias on new goals
      gamma: 0.015
      motion_model: "Omni"     # holonomic: samples vx + vy + wz trajectories
      visualize: false
      reset_period: 0.3        # was 1.0 — clears stale warm-start trajectory within 2 control cycles
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
                "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0        # reduced: allow backward escape without large penalty
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 252.0    # only penalize inscribed/lethal zone; allows paths through inflation (tight corridors)
        consider_footprint: true
        collision_cost: 100000.0  # lower: not 1M — avoids "all trajectories rejected" in tight corners
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0        # was 14.0 — reduced so alignment doesn't dominate progress
        max_path_occupancy_ratio: 0.10
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0       # was 5.0 — now the dominant critic; drives fast progress
        offset_from_furthest: 8  # was 5 — targets further ahead → more momentum
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.4  # was 1.0 — more aggressive turn toward path target
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 6.0   # at 1.0 m/s robot moves 17 cm between 6 Hz updates — safe margin
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 3.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Square footprint matching rover body (0.38 m × 0.26 m) + 1 cm padding
      footprint: "[[0.21, 0.15], [0.21, -0.15], [-0.21, -0.15], [-0.21, 0.15]]"
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # inflation_radius çevrel yarıçapın (≈0.27 m) ALTINA inerse planner köşeleri
        # duvara sürtecek yollar çizer — "engelden kaçamama"nın ana nedeni buydu.
        # Dar geçiş kaygısı cost_scaling_factor ile çözülür: 3.5 hızlı sönüm →
        # kapı ortasındaki maliyet düşük kalır, DWB geçişi reddetmez.
        cost_scaling_factor: 3.5
        inflation_radius: 0.28
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        tf_filter_tolerance: 5.0  # scan zaman damgası ile TF arasındaki max fark; RPi DDS gecikmesi için artırıldı
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          inf_is_valid: false
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 3.0
      # rolling_window=true (12×12 m) robottan ~6 m'den uzak RViz hedeflerini
      # costmap DIŞINDA bırakıyordu → ComputePathToPose anında başarısız,
      # "haritada işaretlediğim yere gitmiyor". false: costmap SLAM/AMCL
      # haritasının tamamını kaplar ve harita büyüdükçe kendiliğinden genişler.
      rolling_window: false
      footprint: "[[0.21, 0.15], [0.21, -0.15], [-0.21, -0.15], [-0.21, 0.15]]"
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: true
      # obstacle_layer eklendi: SLAM haritasına henüz işlenmemiş (veya nav
      # modunda hiç olmayan) engeller de global plana girsin.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        tf_filter_tolerance: 5.0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.28   # local costmap ile aynı — dar geçiş toleransı için 0.32'den düşürüldü
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""   # set at launch time via map:= argument

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 4.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true        # A* is more efficient than Dijkstra on open maps
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 12.0
    # BackUp: short physical reverse to escape wall contact when MPPI optimizer
    # fails (all sampled trajectories in lethal zone). Spin is still disabled —
    # it wastes time during frontier exploration.
    behavior_plugins: ["backup", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 1.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.2

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 10.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Açısal limit DWB max_vel_theta'nın (0.65) üzerinde olmalı — 0.55 dönüş
    # komutlarını kırpıyordu. Açısal ivme 0.50 → 0.80: kaçış dönüşü hedef
    # hıza recovery fazı bitmeden ulaşsın.
    max_velocity: [1.0, 0.55, 0.70]  # match vx_max
    min_velocity: [-0.75, -0.50, -0.70]
    max_accel: [1.2, 1.0, 0.80]
    max_decel: [-1.5, -1.2, -0.80]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# Lifecycle manager — increase bond_timeout for slower hardware (Raspberry Pi).
# Default 4.0 s is too tight; behavior_server takes ~6 s to bond on first start.
lifecycle_manager_navigation:
  ros__parameters:
    bond_timeout: 10.0
    attempt_respawn_reconnection: false
