# Nav2 for the mecanum rover. MPPI uses the same REP-103 body frame as
# ros2_control and teleop. Conservative limits keep combined wheel commands
# below 18.75 rad/s at r=0.04 m: vx + |vy| + 0.32*|wz| <= 0.75 m/s.

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.15
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    # Mecanum base is holonomic; using the omni motion model avoids AMCL
    # over-trusting differential-drive assumptions during strafing / rotation.
    # (odom_model_type is a pre-Humble AMCL param and no longer exists —
    # verified against nav2_amcl/src/amcl_node.cpp on the humble branch;
    # robot_model_type below is the real Humble-era plugin selector.)
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"  # mecanum is holonomic/omnidirectional
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan
    map_topic: /map
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 100
    default_server_timeout: 10000
    wait_for_service_timeout: 1000
    # error_code_names is an Iron/Jazzy+ bt_navigator param — not declared by
    # nav2_bt_navigator on Humble (verified against source), so it was dropped.
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    # Costmap-temizlemeli recovery ağacı: tek planlama/takip hatasında hedefi
    # düşürmek yerine costmap'leri temizleyip yeniden dener (fiziksel spin yok —
    # keşifte slam_manager kara listesi bozulmaz, RViz hedefleri çok daha dayanıklı).
    default_nav_to_pose_bt_xml: "/ws/install/share/ecza_navigation/config/navigate_to_pose_w_recovery.xml"
    # bt_navigator always instantiates navigate_through_poses. Point it to the
    # no-recovery tree so it does not need Spin / BackUp plugins.
    default_nav_through_poses_bt_xml: "/ws/install/share/ecza_navigation/config/navigate_through_poses_no_recovery.xml"
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    # Plugins for navigate_to_pose_w_recovery.xml + navigate_through_poses_no_recovery.xml.
    # ReactiveSequence is a BehaviorTree.CPP built-in — no separate plugin needed.
    # 08b6d34 birleştirmesi bu listeyi bozdu: recovery_node ve
    # clear_costmap_service iki kez listeleniyordu (aynı eklentiyi iki kez
    # kaydetmek BT::BehaviorTreeFactory'de hata), ve navigate_to_pose_w_recovery.xml
    # <BackUp> kullanmasına rağmen nav2_back_up_action_bt_node hiç yoktu —
    # ağaç "Unregistered node: BackUp" ile yüklenmiyordu. Mükerrerler kaldırıldı,
    # BackUp eklendi. Spin hâlâ bilerek yok: keşifte yerinde dönmek zaman kaybı.
    plugin_lib_names:
      - nav2_pipeline_sequence_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_back_up_action_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 6.0   # MPPI 600 sample × 18 adım Pi 5'te 6 Hz'de kararlı
                                # (model_dt 0.17 >= 1/6 = 0.167 olmalı)
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001     # non-zero: mecanum can strafe
    min_theta_velocity_threshold: 0.001
    # Retry transient controller failures briefly. Nav2 publishes zero on
    # recoverable controller exceptions; the teleop watchdog handles silence.
    failure_tolerance: 1.0
    # Humble'da parametrenin adı TEKİL: progress_checker_plugin.
    # Çoğul biçim (progress_checker_plugins) Iron ile geldi; burada
    # tanımlanmadığı için sessizce yok sayılıyordu. Canlı doğrulama:
    # `ros2 param list /controller_server | grep progress` -> yalnızca
    # `progress_checker_plugin` çıkıyor. Varsayılan id de "progress_checker"
    # olduğu için aşağıdaki alt-blok şans eseri uygulanıyordu; yine de
    # yapılandırmanın gerçekten okunduğu bir isim kullanılıyor.
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    # EKF (encoder+IMU füzyonu, bkz. ekf.yaml) — bt_navigator zaten bunu
    # okuyor; MPPI'nin rollout'lar için kullandığı anlık hız tahmini de
    # tekerlek-only /odom yerine buradan gelsin.
    # use_realtime_priority is not declared by nav2_controller on Humble
    # (added in a later distro) — verified against source, dropped.
    odom_topic: "/odometry/filtered"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 8.0   # 8 s'de 10 cm ilerleyemediyse takılmıştır — beklemeyi uzatma

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15   # 0.08 mecanum kayması ile hedef etrafında yörüngeye sokuyordu
      # Frontier exploration only needs the robot to reach the area; forcing a
      # final heading makes the rover spin in place around otherwise valid goals.
      yaw_goal_tolerance: 3.14

    # MPPI Omni: 3.06 s prediction at 6 Hz, bounded for the Pi's CPU budget.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 18
      model_dt: 0.17          # must be >= 1/controller_frequency (1/6 ≈ 0.167)
      batch_size: 400
      # 2026-09-24 hiz artisi + hareket onceligi: ileri/geri > donus > yan.
      # Olculen gerekce: saf yan komut (linear.y) robotu 13.3 cm ILERI, sadece
      # 3.0 cm yana goturdu — bu sasi yana duzgun gidemiyor, dolayisiyla MPPI'nin
      # yan yorunge ornekleme yetkisi kisildi. Artik hedefe once donup duz
      # gitmeyi tercih ediyor; yan hareket yalnizca ince hizalama icin kaldi.
      #
      # Kinematik tavan (r=0.04, lx+ly=0.32, firmware MAX_SPEED_RAD_S=18.75):
      #   saf ileri  -> teker = vx/0.04 = 25*vx  -> vx  <= 0.75
      #   saf donus  -> teker = wz*0.32/0.04 = 8*wz -> wz <= 2.34
      #   birlesik   -> 25*vx + 8*wz + 25*vy <= 18.75
      # Secilen degerlerde en kotu hal 12.5+6.4+1.25 = 20.15, yani yalnizca
      # ucu birden tam gazda hafif saturasyon. Saturasyon bir bileseni kirpip
      # hareketi bozdugu icin bilincli olarak sinirin yakininda kalindi.
      vx_std: 0.22             # 0.15 -> daha yuksek hiz icin daha genis ileri ornekleme
      vy_std: 0.03             # 0.10 -> yan ornekleme neredeyse kapali (en dusuk oncelik)
      wz_std: 0.4              # 0.3  -> donus daha cok denenir (ikinci oncelik)
      vx_max: 0.50             # 0.30 -> %67 hizli
      vx_min: -0.25            # 0.15 -> geri kacis da hizlansin
      vy_max: 0.05             # 0.15 -> yan hareket son care
      wz_max: 0.80             # 0.60 -> donerek yonelme hizlansin
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 1.0
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"     # holonomic: samples vx + vy + wz trajectories
      visualize: false
      reset_period: 1.0        # retain warm start across ordinary control jitter
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
                "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        # 2.0 -> 5.0: kullanici onceligi "duz gidebilecekken garip hareket
        # yapmasin". Daha yuksek agirlik geri/capraz cozumleri cezalandirir,
        # ileri gitmeyi tercih ettirir. Geri kacis hala mumkun (vx_min -0.25)
        # ama artik ilk secenek degil.
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.3
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0       # follow the path through turns
        max_path_occupancy_ratio: 0.10
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 4
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.4  # was 1.0 — more aggressive turn toward path target
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      # 12x12 -> 6x6 sayesinde hücre sayısı 57.6k'dan 14.4k'ya düştü, o yüzden
      # güncelleme hızı 2.5 -> 4.0'a çıkarılabildi. Local costmap'in görevi
      # rviz'de manzara göstermek değil, DWB'nin denediği yörüngeleri
      # kapsamaktır: sim_time 1.2 s x max_speed_xy 0.90 m/s = 1.1 m ileri.
      # 6x6 (robot etrafında 3 m yarıçap) buna fazlasıyla yeter; 12 m menzilin
      # tamamı zaten global costmap'te (yukarıda obstacle_layer eklendi) ve
      # /scan görselleştirmesinde görünüyor.
      update_frequency: 4.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      # 3.0 -> 1.0. 3 saniyelik tolerans, 0.75 m/s'de 2.2 metrelik konum
      # hatasıyla engel işaretlemek demek — engeller costmap'e yanlış yere
      # çizilir. 1.0 s RPi gecikmesi için hâlâ cömert (MentorPi 0.1 kullanıyor).
      transform_tolerance: 1.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Wheel envelope from configured geometry: x=0.19+0.04, y=0.13+0.03.
      # The separate padding adds 1 cm; do not count wheel clearance twice.
      footprint: "[[0.23, 0.16], [0.23, -0.16], [-0.23, -0.16], [-0.23, 0.16]]"
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # tf_filter_tolerance is not a real nav2_costmap_2d::ObstacleLayer param
        # on Humble (verified against source) — the laser message_filter's TF
        # wait tolerance is hardcoded to 0.05s in obstacle_layer.cpp on this
        # distro, not configurable. The costmap-level transform_tolerance: 3.0
        # above is the real RPi-lag safety margin.
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          # 4.0 -> 12.0: temizleme menzili işaretleme menzilinden büyük
          # olmalı, aksi halde uzaktaki eski engeller hiç silinmez.
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          # 3.0 -> 10.0: asıl kesme buydu. Lidar 12 m'ye kadar dönüş veriyor
          # ama 3 m'den uzaktaki algılamalar engel olarak işaretlenmediği için
          # rviz'de daire olarak çizilmiyordu. Geçerli dönüşlerin %99'u 10 m
          # içinde, dolayısıyla 10 m pratikte tüm algılamaları kapsıyor.
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
          inf_is_valid: false
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 1.0   # local_costmap ile aynı gerekçe (3.0 -> 1.0)
      # Rolling window KAPALI: static_layer, costmap'i gelen /map ile birebir
      # aynı boyuta ve orijine getirir (resizeMap). Böylece rviz'de costmap ile
      # harita tam üst üste biner (tek bölge) ve keşif ilerledikçe costmap de
      # haritayla birlikte büyür — sabit pencerede kalan kırpma sorunu olmaz.
      #
      # ÖNKOŞUL: /map geçerli olmalı. Bu ayar bir kez denenip geri alınmıştı;
      # o sırada scan_restamper'ın slam_angle_downsample=4 ayarı yüzünden
      # slam_toolbox'a giden taramalar boş geliyor ve /map KALICI olarak 0x0
      # kalıyordu. static_layer bunu "malformed" diye reddedince costmap
      # varsayılan orijinde ([0,12]x[0,12]) asılı kalıyor, harita ile robot
      # rviz'de iki ayrı bölge gibi görünüyordu. slam_angle_downsample=2
      # düzeltmesinden sonra harita saniyeler içinde oluştuğu için bu mod
      # artık güvenli; hizasızlık yalnızca ilk /map gelene kadar sürer.
      rolling_window: false
      # Sadece ilk /map mesajı gelene kadar kullanılan başlangıç boyutu;
      # sonrasında boyutu static_layer belirler.
      width: 20
      height: 20
      footprint: "[[0.23, 0.16], [0.23, -0.16], [-0.23, -0.16], [-0.23, 0.16]]"
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: true
      # obstacle_layer EKLENDİ (2026-08-12). Önceden sadece static + inflation
      # vardı, yani global planner YALNIZCA /map'i görüyordu. /map ise SLAM'da
      # 1.5 s'de bir (map_update_interval), nav modunda ise HİÇ güncellenmiyor.
      # Sonuç: haritada olmayan bir engel (insan, sandalye, açılmış kapı)
      # planner için görünmezdi — planner tam üstünden geçen bir yol üretiyor,
      # local planner engeli görüp yolu reddediyor, robot duruyor ve hedef
      # başarısız oluyordu. MentorPi de global costmap'te obstacle_layer
      # kullanıyor (navigation/config/nav2_params.yaml).
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          # clearing menzili marking menzilinden büyük olmalı, yoksa uzaklaşan
          # engeller global costmap'te kalıcı hayalet olarak kalır.
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # A continuous cost gradient favours corridor centres before contact.
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""   # set at launch time via map:= argument

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 4.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true        # A* is more efficient than Dijkstra on open maps
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    # On Humble, nav2_behaviors::BehaviorServer only declares a single
    # "costmap_topic"/"footprint_topic" pair (no local_/global_ split — that's
    # a later-distro addition) and a single "global_frame" (default "odom",
    # not "map") consumed by TimedBehavior for the local-costmap-relative
    # behaviors (Spin/BackUp/DriveOnHeading). "local_frame" was never a real
    # param. Verified against nav2_behaviors/src/behavior_server.cpp on the
    # humble branch. Values below point at local_costmap either way, so this
    # is a naming fix, not a behavior change — no impact on "wait" (see below).
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 12.0
    # BackUp: short physical reverse to escape wall contact when MPPI optimizer
    # fails (all sampled trajectories in lethal zone). Spin is still disabled —
    # it wastes time during frontier exploration.
    behavior_plugins: ["backup", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    # nav2_behaviors::Wait is a pure timer (no TF/costmap use — verified
    # against wait.cpp), so global_frame/robot_base_frame/transform_tolerance
    # below are inert for it; kept correct in case Spin/BackUp/DriveOnHeading
    # (which DO read simulate_ahead_time/*_rotational_vel/rotational_acc_lim)
    # are ever re-enabled.
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 1.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.2

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    # action_server_result_timeout is not declared by nav2_waypoint_follower
    # on Humble (verified against source) — dropped.
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 10.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    # Preserve the direction of the requested vector when an axis is limited.
    # MPPI limitleriyle birebir hizali olmali: smoother daha dar olursa
    # MPPI'nin urettigi komut kirpilir ve robot planladigindan farkli hareket
    # eder (bu da "garip hareket" olarak gorunur).
    max_velocity: [0.50, 0.05, 0.80]   # vx, vy, wz — MPPI vx_max/vy_max/wz_max ile ayni
    min_velocity: [-0.25, -0.05, -0.80]
    max_accel: [0.8, 0.4, 1.4]         # daha hizli kalkis; donus ivmesi en yuksek
    max_decel: [-1.0, -0.6, -1.6]      # frenleme ivmeden buyuk: engelde hizli dursun
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.3

# Lifecycle manager — increase bond_timeout for slower hardware (Raspberry Pi).
# Default 4.0 s is too tight; behavior_server takes ~6 s to bond on first start.
lifecycle_manager_navigation:
  ros__parameters:
    bond_timeout: 10.0
    attempt_respawn_reconnection: false
