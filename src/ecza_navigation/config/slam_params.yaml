# slam_params.yaml — SLAM Toolbox config for ecza-robotu.
#
# Mode: online_async — builds map in real time as the robot moves.
# Switch to localization mode after saving a map (see nav2_navigation.launch.py).
# ---------------------------------------------------------------------------

slam_toolbox:
  ros__parameters:
    # Plugin/mode
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frames
    odom_frame: odom
    map_frame: map
    base_frame: base_link     # controller publishes odom→base_link on /tf
    scan_topic: /scan_slam
    use_map_saver: true
    mode: mapping        # mapping | localization

    # Pose graph
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.08   # ~12 Hz TF; RPi'de CPU'yu bunaltmadan yeterince sık
    map_update_interval: 1.0
    resolution: 0.05
    min_laser_range: 0.20
    max_laser_range: 10.0
    minimum_time_interval: 0.20
    transform_timeout: 1.5
    tf_buffer_duration: 60.0
    stack_size_to_use: 40000000

    # Loop closure
    enable_interactive_mode: false
    use_scan_matching: true
    use_scan_barycenter: false
    minimum_travel_distance: 0.08   # dar alanlarda daha sık scan matching
    minimum_travel_heading: 0.10   # dönüşte harita geç güncellenip kaymasın
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.35  # 0.50 çok katıydı: scanler grafa bağlanamayıp kayma birikiyordu
    distance_variance_penalty: 0.8
    angle_variance_penalty: 0.5   # 8.0 açısal düzeltmeyi fiilen kapatıyordu → odom dönüş hatası haritaya işleniyordu; 2.0 hâlâ çok katıydı dönüş kayması devam ediyordu
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.524
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 1.2
    minimum_distance_penalty: 0.5
    use_response_expansion: true
