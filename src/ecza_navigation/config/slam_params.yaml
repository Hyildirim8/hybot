# slam_params.yaml — SLAM Toolbox config for ecza-robotu.
#
# Mode: online_async — builds map in real time as the robot moves.
# Switch to localization mode after saving a map (see nav2_navigation.launch.py).
# ---------------------------------------------------------------------------

slam_toolbox:
  ros__parameters:
    # Plugin/mode
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frames
    odom_frame: odom
    map_frame: map
    base_frame: base_link     # controller publishes odom→base_link on /tf
    scan_topic: /scan
    use_map_saver: true
    mode: mapping        # mapping | localization

    # Pose graph
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02   # 50 Hz TF updates
    map_update_interval: 1.0         # faster map refresh while exploring
    resolution: 0.05
    max_laser_range: 10.0
    minimum_time_interval: 0.2
    transform_timeout: 1.0
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # Loop closure
    enable_interactive_mode: true
    use_scan_matching: true
    use_scan_barycenter: false         # koridorda dönüşte yalancı paralel koridor eşleşmesini azalt
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.50       # 90° dönüşte max 3 node → yaw hatası birikimini azalt
    scan_buffer_size: 15              # was 10 — daha fazla scan ortalaması, daha sağlam eşleşme
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.25  # dönüş sırasında geçerli eşleşmeleri kabul et
    distance_variance_penalty: 0.8
    angle_variance_penalty: 1.6
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.524     # was 0.349 — 30° geniş arama, odometri hatasını tolere et
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 1.2
    minimum_distance_penalty: 0.5
    use_response_expansion: true
