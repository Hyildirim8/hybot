# teleop_twist_joy mapping for Logitech F710 (Task 1)
# NOTE: Current docker compose runtime uses ecza_teleop/teleop_node with
# /config/rover_params.yaml, not teleop_twist_joy.
# Editing this file alone does not change active robot control behavior.
#
# Typical F710 axis mapping in XInput mode on Linux:
#   left stick  left/right   -> axis 0
#   left stick  up/down      -> axis 1
#   right stick left/right   -> axis 2
#
# Deadman: RB (button 5)
# Alternative deadman: RT is often button 7 in DInput mode; change if needed.

joy_node:
  ros__parameters:
    dev: /dev/input/js0
    deadzone: 0.10
    autorepeat_rate: 30.0

teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 5

    # Keep turbo disabled for predictable kinematics during bring-up.
    enable_turbo_button: -1

    axis_linear:
      x: 1
      y: 0

    scale_linear:
      x: 0.8
      y: 0.8

    axis_angular:
      yaw: 2

    scale_angular:
      yaw: 1.2
