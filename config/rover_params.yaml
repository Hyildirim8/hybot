# rover_params.yaml — Single runtime configuration for the ecza-robotu stack.
#
# Mounted read-only into all service containers at /config/rover_params.yaml.
# Edit this file and restart the stack (no image rebuild needed).
#
# IMPORTANT: All keys use ros__parameters (double underscore).
# Missing required keys cause the affected node to log ERROR and exit.
#
# Canonical source of truth: specs/006-docker-runtime/contracts/compose-schema.md §2

/**:
  ros__parameters:

    # ── Rover geometry ────────────────────────────────────────────────────────
    # All values must be positive non-zero floats.
    # NOTE: wheel_radius, wheel_base, wheel_separation_width are also set in
    #       config/controllers.yaml for mecanum_drive_controller — keep in sync.
    wheel_separation_width: 0.26   # metres — left/right wheel centre distance
    wheel_base: 0.38               # metres — front/rear axle centre distance
    wheel_radius: 0.08             # metres — measure physical wheel and update

    # ── Speed limits ──────────────────────────────────────────────────────────
    max_linear_speed: 1.5          # m/s — maximum translational speed
    max_angular_speed: 3.0         # rad/s — maximum rotation speed

    # ── Joystick (Logitech Cordless RumblePad 2) ──────────────────────────
    # Logitech F710 Gamepad — D-mode (switch on back set to D), linux joy driver
    # Axes (6 total):
    #   0 = left  stick X   (left=-1, right=+1)
    #   1 = left  stick Y   (up=+1,   down=-1)  ← forward/backward
    #   2 = right stick X   (left=-1, right=+1)  ← rotation
    #   3 = right stick Y   (up=+1,   down=-1)
    #   4 = D-pad X         (left=-1, right=+1)
    #   5 = D-pad Y         (up=+1,   down=-1)
    # Buttons (12 total):
    #   0=X   1=A   2=B   3=Y
    #   4=LB  5=RB  6=LT  7=RT
    #   8=Back  9=Start  10=L3  11=R3
    joy_deadzone: 0.05             # [0, 1) — smoother low-speed stick response
    axis_linear_x: 1               # left  stick Y — forward / backward
    axis_linear_y: 0               # left  stick X — right stick motion maps to right strafe (vy < 0)
    axis_angular_z: 2              # right stick X — rotate CCW / CW
    enable_button: 5               # RB — dead-man switch
    enable_button_alt: 4           # LB — alternate dead-man for mode compatibility
    require_enable_button: true    # safety: drive only while RB/LB dead-man is held
    btn_strafe_left: 6             # LT — instant full-speed strafe left  (vy > 0)
    btn_strafe_right: 7            # RT — instant full-speed strafe right (vy < 0)
    btn_auto_mode: 9               # Start toggles TELEOP <-> AUTONOMOUS (Nav2)
    btn_auto_mode_alt: -1          # optional alternate toggle disabled
    auto_toggle_debounce_ms: 400   # prevent rapid mode flip-flop from button bounce
    nav_cmd_topic: "/cmd_vel"      # Nav2 output topic in Humble bringup
    start_in_autonomous: true      # allow Nav2 goals immediately after nav stack starts
    autorepeat_rate: 30.0          # Hz — smoother teleop command stream

    # ── Watchdog timeouts ─────────────────────────────────────────────────────
    # Two distinct watchdogs — do not conflate them.
    joy_watchdog_timeout_ms: 500        # ms — avoids false zeroing from brief /joy jitter
    firmware_watchdog_timeout_ms: 500   # ms — ESP32 stops motors on /wheel_velocities silence
                                        # (informational here; firmware reads from NVS)

    # ── micro-ROS agent (informational) ──────────────────────────────────────
    # The actual agent port is set via the AGENT_PORT env var in .env.
    # Keep this in sync with AGENT_PORT.
    agent_port: 8888               # UDP port for micro-ROS agent
    agent_bind_address: "0.0.0.0"  # bind to all interfaces
