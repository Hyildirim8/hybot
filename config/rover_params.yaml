# rover_params.yaml — Single runtime configuration for the ecza-robotu stack.
#
# Mounted read-only into all service containers at /config/rover_params.yaml.
# Edit this file and restart the stack (no image rebuild needed).
#
# IMPORTANT: All keys use ros__parameters (double underscore).
# Missing required keys cause the affected node to log ERROR and exit.
#
# Canonical source of truth: specs/006-docker-runtime/contracts/compose-schema.md §2

/**:
  ros__parameters:

    # ── Rover geometry ────────────────────────────────────────────────────────
    # All values must be positive non-zero floats.
    # NOTE: wheel_radius, wheel_base, wheel_separation_width are also set in
    #       config/controllers.yaml for mecanum_drive_controller — keep in sync.
    wheel_separation_width: 0.26   # metres — left/right wheel centre distance
    wheel_base: 0.38               # metres — front/rear axle centre distance
    wheel_radius: 0.04             # metres — 80 mm diameter mecanum wheel

    # ── Speed limits ──────────────────────────────────────────────────────────
    max_linear_speed: 0.9          # m/s — haritalamada odom/SLAM yükünü düşük tut
    max_angular_speed: 1.8         # rad/s — saat yönü dahil manuel dönüşü hızlandır

    # ── Joystick (Logitech Cordless RumblePad 2) ──────────────────────────
    # Logitech F710 Gamepad — D-mode (switch on back set to D), linux joy driver
    # Axes (6 total):
    #   0 = left  stick X   (left=-1, right=+1)
    #   1 = left  stick Y   (up=+1,   down=-1)  ← forward/backward
    #   2 = right stick X   (left=-1, right=+1)  ← rotation
    #   3 = right stick Y   (up=+1,   down=-1)
    #   4 = D-pad X         (left=-1, right=+1)
    #   5 = D-pad Y         (up=+1,   down=-1)
    # Buttons (12 total):
    #   0=X   1=A   2=B   3=Y
    #   4=LB(dead-man alt)  5=RB(dead-man)  6=LT(sağ taraf pivot)  7=RT(sol taraf pivot)
    #   8=Back  9=Start  10=L3  11=R3
    #
    # Pivot hareketleri (LT/RT/D-pad): 4 tekerden sadece bir çifti hareket eder,
    # diğer çift tam sıfırda kalır (yerinde dönüş DEĞİL, tek taraf/aks pivotu).
    # 2026-08-01: yönler ters bildirilmişti (ilk yazımda), çevrildi:
    #   LT          → sağ taraf (FR+RR) ileri, sol taraf sabit → geniş sola dönüş
    #   RT          → sol taraf (FL+RL) ileri, sağ taraf sabit → geniş sağa dönüş
    #   D-pad sol   → arka aks: RR ileri / RL geri, ön aks sabit
    #   D-pad sağ   → arka aks: RL ileri / RR geri, ön aks sabit
    #   D-pad yukarı→ ön aks: FR ileri / FL geri, arka aks sabit
    #   D-pad aşağı → ön aks: FL ileri / FR geri, arka aks sabit
    joy_deadzone: 0.05             # [0, 1) — smoother low-speed stick response
    axis_linear_x: 1               # left  stick Y — forward / backward
    axis_linear_y: 0               # left stick X: right=+1 from joystick, ROS right strafe must be -Y
    axis_angular_z: 2              # right stick X — rotate CW / CCW
    # 2026-07-30: false denendi (yön ters sanılmıştı) ama gerçek sorun saçma/
    # kararsız dönüş hareketiydi (aşağıdaki max_angular_speed'e bakın) — false
    # bunu düzeltmedi. f76063e'deki (kullanıcının "düzgündü" dediği commit)
    # bilinen-iyi değere geri alındı.
    # 2026-07-31: tam kontrol taramasında sağ/sol dönüş yönü ters ölçüldü
    # (sağ = CCW, sol = CW) — kullanıcı isteğiyle false yapıldı, sağ artık CW.
    angular_invert: false          # TELEOP: sağa itince saat yönünde dönmüyorsa true
    enable_button: 5               # RB — dead-man switch
    enable_button_alt: 4           # LB — alternate dead-man for mode compatibility
    require_enable_button: false   # manuel modda RB/LB basmadan sürüş aktif
    axis_dpad_x: 4                 # D-pad sol/sağ — arka aks pivotu (yukarıdaki tabloya bak)
    axis_dpad_y: 5                 # D-pad yukarı/aşağı — ön aks pivotu (yukarıdaki tabloya bak)
    btn_pivot_left: 6              # LT — sadece sağ taraf tekerleri ileri (geniş dönüş, 2026-08-01 ters çevrildi)
    btn_pivot_right: 7             # RT — sadece sol taraf tekerleri ileri (geniş dönüş, 2026-08-01 ters çevrildi)
    pivot_wheel_speed_rad_s: 10.0  # aktif teker çifti hedef hızı; firmware MAX_SPEED_RAD_S=18.75'i satüre etmesin diye düşük tutuldu
    strafe_invert: false           # manuel strafe: hem manuel hem rvizde ters bildirildi, false'a geri alındı (2026-08-01)
    auto_strafe_invert: true       # slam_manager ROS konv. (+y=sol) üretir; donanım +y=sağ → teleop burada çevirir
    # Index 9 IS Start on this pad. Do not "fix" it to 11 again: that was tried
    # on 2026-08-11 because `jstest` prints the button list as
    # A,B,C,X,Y,Z,TL,TR,TL2,TR2,Select,Start — but those are just the evdev
    # keycodes joydev hands out in order, NOT the F710's physical layout. The
    # F710 in DirectInput mode reports 0-3=face, 4=LB, 5=RB, 6=LT, 7=RT,
    # 8=Back, 9=Start, 10=L3, 11=R3 — consistent with btn_pivot_left/right
    # below being LT/RT at 6/7. Setting this to 11 binds mode toggle to the
    # right stick click, so pressing Start does nothing at all.
    btn_auto_mode: 9               # Start toggles TELEOP <-> AUTONOMOUS (Nav2)
    btn_auto_mode_alt: -1          # no alternate toggle
    btn_auto_mode_candidates: [9]  # only Start toggles TELEOP <-> AUTO
    auto_toggle_debounce_ms: 400   # prevent rapid mode flip-flop from button bounce
    mode_handoff_stop_s: 0.35      # AUTO/MANUAL geçişte eski komutları kısa süre kes
    nav_cmd_topic: "/cmd_vel_nav_smoothed"  # velocity_smoother çıkışı: /cmd_vel_nav_smoothed (smoother bypass'ını düzelt)
    auto_enable_on_nav_cmd: true    # RViz Nav2 goal komut üretince otomatik AUTO'ya geç
    start_in_autonomous: false     # start in TELEOP so joystick works immediately; press Start (btn 9) to switch to AUTO/Nav2
    reject_extreme_axis_startup: false  # joystick başlangıçta ±1 gönderince bekleme — kapat
    autorepeat_rate: 30.0          # Hz — smoother teleop command stream
    enable_scan_safety: true       # block forward drive if /scan sees a close frontal obstacle
    enable_scan_safety_in_auto: false # AUTO'da Nav2 costmap zaten engelleri yönetiyor; bu katman Nav2'yi geçersiz kılıyor
    auto_emergency_stop_distance: 0.15 # sadece fiziksel temas riski; 0.22 dar kapı kenarlarında geçişi kesiyordu
    scan_topic: "/scan"
    front_obstacle_stop_distance: 0.30 # 0.45 geçilebilir aralıkları da kapatıyordu — dar geçiş için düşürüldü
    front_obstacle_clear_distance: 0.50
    front_obstacle_angle_deg: 36.0
    avoidance_turn_speed: 0.45
    avoidance_strafe_speed: 0.25

    # ── slam_manager (SLAM + otonom keşif) ───────────────────────────────────
    # Buttons (12 total):
    #   0=X  1=A  2=B  3=Y  4=LB  5=RB  6=LT  7=RT  8=Back  9=Start  10=L3  11=R3
    btn_save_map: 3                # Y — mevcut SLAM haritasını /maps/ dizinine kaydet
    btn_explore_toggle: 1          # A — AUTO moddayken otonom frontier keşfini aç/kapat
    btn_reset_pose: 10             # L3 — AMCL poz sıfırlama (/initialpose yayınla)
    btn_debounce_ms: 150           # buton sıçramasını önle
    map_save_dir: "/maps"          # kayıt dizini (navigation container'daki bağlama)
    frontier_min_cells: 8          # küçük frontier kümelerini görmezden gel
    frontier_obstacle_padding_m: 0.20 # dar kapı/koridor frontierlarını gereksiz eleme
    failed_goal_blacklist_radius_m: 0.32 # dar alanlarda komşu geçerli hedefleri karartma
    max_failed_goals: 20
    goal_timeout_s: 12.0           # saniye — takılan Nav2 hedefi en fazla 12 s sürebilir; 30 s "donup kalma" hissi veriyordu
    explore_interval_s: 2.0        # saniye — frontier hesabı CPU-yoğun; 1.0 komut döngüsünü boğup kesik harekete yol açıyordu
    visited_penalty_radius_m: 3.0  # oda boyutunda ziyaret hafızası — haritalanan odaya geri dönmeyi azalt
                                   # (ceza tam dışlama değil ×0.02 skor; başka aday yoksa yine gidilir)
    direct_explore_fallback: true   # Nav2 hedef kabul etmezse düşük hızda keşif sürüşü
    lidar_angle_offset_deg: 180.0   # lidar is physically mounted 180° reversed on chassis
    # Direct exploration fallback should be quicker than before, but still
    # gentler than full-speed teleop so SLAM does not smear corridor corners.
    direct_explore_speed: 0.45
    # 0.30 dönüş köşelerden kurtulmaya yetmiyordu (recovery döngüsünde ~55°).
    # SLAM artık dönüş sırasında da tarama aldığı için (max_slam_angular_z=0.50)
    # 0.45 rad/s harita kalitesini bozmadan kullanılabilir.
    direct_explore_turn_speed: 0.45
    direct_explore_backup_speed: 0.20
    direct_explore_strafe_speed: 0.30
    direct_explore_kp: 0.90              # PID P: dar geçişte boşluk merkezine hızlı ve kararlı yönelme
    direct_explore_ki: 0.0               # PID I: hedef açı sürekli değişiyor — integral salınım yapıyordu, kapatıldı
    direct_explore_kd: 0.18              # PID D: sönümleme; 0.24 P'yi fazla bastırıyordu
    direct_explore_pid_i_limit: 0.25     # integral rüzgarını sınırla (ki=0 iken etkisiz)
    direct_explore_lookahead_deg: 140.0  # açık yön arama açısı (±70°) — ±40° dardı: açık taraf koni dışındaysa robot duvara bakakalıyordu
    direct_explore_react_distance: 2.0   # sadece 2m içindeki engeller yönü etkiler
    min_side_clearance_m: 0.12          # dar koridor: her iki yan < 0.12m → çok dar
    direct_explore_stop_distance: 0.28  # 0.42 geçilebilir kapılarda bile duruyordu — "geçemiyor" şikayeti üzerine düşürüldü
    direct_explore_escape_distance: 0.18 # kaçış sadece gerçekten sıkışınca tetiklensin
    direct_explore_front_angle_deg: 40.0  # ±20° ön koni: kapı kenarları "ön engel" sayılmasın
    direct_explore_recovery_backup_time_s: 1.1   # recovery faz-1: geri çekil süresi (0.9 → 1.1 daha geniş açılır)
    direct_explore_recovery_rotate_time_s: 3.2   # recovery faz-2: düşük hızla ~90°+ dönüş için

    # ── wheel_bridge (motor wiring + odometry alignment) ───────────────────
    # command_direction_signs: FL/RL motor channels are wired backwards on the
    # H-bridge (LPWM drives them in reverse). Negate FL and RL commands so all
    # four wheels spin forward when commanded forward.
    # state_direction_signs mirrors the motor wiring correction so ros2_control
    # sees wheel feedback in the same frame it commands. Without this, RViz
    # interprets real forward motion as yaw/strafe.
    command_direction_signs: [-1.0, 1.0, -1.0, 1.0]
    state_direction_signs: [-1.0, 1.0, -1.0, 1.0]
    # Sol/sağ encoder dengesizliği düzeltmesi — [FL, FR, RL, RR].
    #
    # 2026-08-13, temiz 3 m düz sürüş, ham /wheel_velocities (işaret
    # düzeltilmiş, ölçeklenmemiş):
    #     FL  95.44   FR 116.37   RL  95.33   RR 114.31 rad
    #     sol 95.39   sağ 115.34   →  sağ/sol = 1.209
    # Aynı sürüşte KOMUT dengeliydi (sol 103.12 / sağ 107.75 = 1.045), yani
    # dört teker fiziksel olarak birlikte döndü.
    #
    # MEKANİZMA — encoder ölçek hatası DEĞİL. Aynı gün yapılan yerinde dönüş
    # testinde aynı ham topic sol/sağ |oran| = 0.9915 verdi, yani dönüşte
    # tekerler dengeli. Encoder'ların kendisinde ölçek hatası olsaydı her iki
    # harekette de görünürdü. Görünmediğine göre sebep DÜZ SÜRÜŞE ÖZGÜ
    # ASİMETRİK PATİNAJ (muhtemelen makara yönelimi/hizası — bkz. daha önceki
    # mekanik makara sorunu).
    #
    # Sonuç: aşağıdaki katsayılar semptomu doğru düzeltiyor (doğrulandı: 3 m'de
    # +29.0 deg -> -1.1 deg) ama ZEMİNE VE HIZA BAĞLI. Farklı bir yüzeyde
    # yeniden ölçmek gerekebilir. Kalıcı çözüm mekanik tarafta.
    #
    # Bu dengesizlik /odom'daki sahte dönüşün TEK kaynağıydı: mecanum yaw
    # formülü wz ~ (-FL + FR - RL + RR) olduğu için sol/sağ farkı doğrudan
    # yöne entegre oluyor. 2 m'lik bir sürüşte encoder +29.0° derken rf2o
    # -5.1° ölçmüştü; ölçülen dengesizliği formüle koyunca +30.3° çıkıyor.
    # odom_angular_scale: 0.85 bunu düzeltmiyor, sadece üstünü örtüyordu.
    #
    # Katsayılar iki tarafı ortalamaya eşitler; TOPLAM korunur, dolayısıyla
    # odom_linear_scale kalibrasyonunu bozmaz (ikisi bağımsız).
    state_scale_factors: [1.1046, 0.9135, 1.1046, 0.9135]
    command_deadband_rad_s: 0.12
    # Real rover is moving less than odom/RViz reports, especially in yaw.
    # Scale encoder-derived odom before ros2_control integrates it.
    # 0.50 -> 0.650. İLK KEZ METREYLE ÖLÇÜLDÜ (2026-08-13), tahmin değil.
    # İki bağımsız şeritmetre ölçümü, saatler arayla, farklı mesafe ve farklı
    # o-anki ölçekle alındı ve %1.2 içinde uyuştu:
    #     sürüş 1: gerçek 1.00 m, /odom 0.764 m (ölçek 0.50)  → 0.654
    #     sürüş 8: gerçek 3.15 m, /odom 3.331 m (ölçek 0.683) → 0.646
    #     ortalama → 0.650
    # Aradaki bir ölçüm 0.711 vermişti ama orada mesafe şeritmetreyle değil
    # tahminle bildirilmişti; ölçülen ikisi alındı.
    #
    # state_scale_factors düzeltmesi bu kalibrasyonu bozmaz: sol/sağ katsayıları
    # ortalamayı koruyacak şekilde seçildi, ham oran 1.209'dan 1.35'e kadar
    # sapsa bile toplamdaki değişim %0.5'in altında kalıyor.
    #
    # PATİNAJ bu değerin içinde: her iki ölçümde de zeminde kayma oldu, yani
    # ~%5'lik pay tekerin boşa dönmesinden geliyor ve ZEMİNE BAĞLI. Farklı bir
    # yüzeyde encoder az okuyacaktır. Patinaj encoder odometrisinin doğasında
    # olan bir sınır; tek gerçek çözümü lazer/harita düzeltmesidir.
    #
    # rf2o REFERANS OLARAK KULLANILMADI: yavaş sürüşte isabetli (1 m'de +%4.8)
    # ama hızlandıkça sistematik az okuyor (3 m'de -%34, 3.15 m'de -%55).
    # Scan-matching range-flow yerel doğrusallaştırma yaptığı için taramalar
    # arası yer değiştirme büyüdükçe hareketi eksik tahmin ediyor. Kalibrasyon
    # yalnızca şeritmetre ölçümlerine dayanıyor.
    odom_linear_scale: 0.650
    odom_lateral_scale: 0.50     # lateral odom gerçek sağ/sol hareketle aynı yönde kalsın
    # 0.85 -> 0.504. ÖLÇÜLDÜ (2026-08-13): yerinde 2 tam tur (720 deg gerçek),
    # /odom -1215.4 deg bildirdi. Ham (ölçeksiz) dönüş 1215.4/0.85 = 1430.0 deg,
    # dolayısıyla 720/1430.0 = 0.504. Ham tekerlerden bağımsız doğrulama:
    # wz ~ (r/4k)(-FL+FR-RL+RR) = -1265 deg hesap vs -1215 deg ölçüm (%4).
    #
    # Neden 1'den bu kadar uzak: mecanumda YERİNDE DÖNÜŞ devasa patinaj
    # demektir — dört teker de yana sürtünür. Encoder'ın %69 fazla okuması
    # fiziksel, bir hata değil.
    #
    # SINIR: bu yüzden tek bir açısal ölçek her harekette doğru olamaz.
    # Yerinde dönüşteki patinaj ile yay çizerek dönerkenki patinaj farklıdır;
    # 0.504 yerinde dönüşe göre kalibre edildi, yaylarda bir miktar az
    # okuyacaktır. Nav2 çoğunlukla yay çizdiği için, otonom sürüşte açısal
    # sapma görülürse önce burayı değil bu uzlaşmayı hatırla.
    odom_angular_scale: 0.504
    odom_linear_deadband: 0.02
    odom_lateral_deadband: 0.0
    odom_angular_deadband: 0.05

    # ── Watchdog timeouts ─────────────────────────────────────────────────────
    # Two distinct watchdogs — do not conflate them.
    # 500 -> 1000: remote joystick over Wi-Fi hit normal network jitter well
    # under 1s that the local wired joystick never would, tripping false
    # zeroing/"kilitlenme" during teleop. 1000ms still fails safe quickly.
    joy_watchdog_timeout_ms: 1000       # ms — avoids false zeroing from brief /joy jitter
    firmware_watchdog_timeout_ms: 500   # ms — ESP32 stops motors on /wheel_velocities silence
                                        # (informational here; firmware reads from NVS)

    # ── micro-ROS agent (informational) ──────────────────────────────────────
    # The actual agent port is set via the AGENT_PORT env var in .env.
    # Keep this in sync with AGENT_PORT.
    agent_port: 8888               # UDP port for micro-ROS agent
    agent_bind_address: "0.0.0.0"  # bind to all interfaces
